{% extends "base.html" %}

{% block content %}
<div class="h-full w-full flex items-center justify-center">
    <div class="w-full max-w-sm bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700 p-8">
        <div class="flex flex-col items-center mb-6">
            <div class="w-12 h-12 bg-primary text-white rounded-xl flex items-center justify-center font-bold text-xl shadow-md mb-3">YC</div>
            <h1 class="font-bold text-lg text-gray-800 dark:text-white">Yat Chung Car Co.</h1>
            <p class="text-sm text-gray-500 dark:text-gray-400">System Login</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="flex flex-col gap-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Username</label>
                <input type="text" name="username" required placeholder="Enter your username"
                    class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-primary focus:outline-none transition-all dark:text-white">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-1">Password</label>
                <input type="password" name="password" required placeholder="Enter your password"
                    class="w-full px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-primary focus:outline-none transition-all dark:text-white">
            </div>
            <button type="submit" class="mt-2 py-3 px-4 bg-primary hover:bg-blue-700 text-white rounded-xl font-bold shadow-lg shadow-blue-500/30 transition-all">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
