{% extends "base.html" %}

{% block content %}
<style>
    body {
        margin: 0;
        padding: 0;
    }
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f7f6; /* Neutral sophisticated palette */
        font-family: sans-serif;
    }
    .login-card {
        background: white;
        padding: 40px;
        border-radius: 12px; /* Rounded corners */
        box-shadow: 0 4px 15px rgba(0,0,0,0.1); /* Visual depth */
        width: 100%;
        max-width: 400px;
        text-align: center;
    }
    .login-card h2 {
        margin-bottom: 20px;
        color: #333;
    }
    
    .form-group {
        margin-bottom: 20px;
        text-align: left;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #555;
    }
    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box; /* Ensures padding doesn't affect width */
        font-size: 16px;
    }
    .login-btn {
        width: 100%;
        padding: 15px; /* Large button size */
        background-color: #0056b3; /* Bold color for visibility */
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }
    .login-btn:hover {
        background-color: #004494;
    }
    .flash-message {
        color: #d9534f;
        background-color: #f2dede;
        border: 1px solid #ebccd1;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 20px;
    }
</style>

<div class="login-container">
    <div class="login-card">
        <h2>System Login</h2>
        
        <!-- Display Flash Messages for Errors -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Login Form POSTs to the /login route in app.py -->
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            
            <button type="submit" class="login-btn">Log In</button>
        </form>
    </div>
</div>
{% endblock %}
